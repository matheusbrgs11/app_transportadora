services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coleta_data:/var/lib/postgresql/data
      - ./database/001_foundation.sql:/docker-entrypoint-initdb.d/001_foundation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  coleta_data:
