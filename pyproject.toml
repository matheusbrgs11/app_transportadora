[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coleta-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1", "PyJWT>=2.15.1,<3", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "email-validator>=2.2,<3",
  "reportlab>=4.2,<5"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
